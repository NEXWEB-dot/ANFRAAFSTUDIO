<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://m7hktaor.apicdn.sanity.io" crossorigin>
  <link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
  <meta name="robots" content="noindex, follow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — ANRAF</title>
  <link rel="icon" type="image/jpeg" href="assets/AnRaf-06.jpg">
  <link rel="apple-touch-icon" href="assets/AnRaf-06.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/store.css">
  <script>window.STORE_CONFIG = { cdnOrigin: '', whatsappUrl: 'https://wa.me/923000000000' };</script>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="header-inner">
      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="logo">ANRAF</a>
      <div class="header-right">
        <a href="/cart.html" class="icon-btn cart-icon" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MOBILE DRAWER -->
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">
    <button class="drawer-close" id="drawer-close" aria-label="Close menu">&times;</button>
    <a class="drawer-logo" href="/">ANRAF</a>
    <nav class="drawer-nav">
      <a href="/store.html">Shop All</a>
      <a href="/store.html?category=lawn">Lawn</a>
      <a href="/store.html?category=embroidery">Embroidery</a>
      <a href="/store.html?category=heritage">Heritage</a>
    </nav>
  </div>
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <main class="cart-main">
    <h1 class="page-title">Your Shopping Cart</h1>
    <div class="cart-layout">
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-sidebar">
        <div class="cart-summary-box">
          <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">PKR 0</span></div>
          <p class="shipping-note">Standard delivery across Pakistan: Rs. 260 PKR.</p>
          <a href="/checkout.html" class="btn-checkout" id="checkout-link">Proceed to Checkout</a>
          <a href="/store.html" class="btn-continue">Continue Shopping</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">ANRAF</p>
    <p class="footer-copy">© 2026 ANRAF Studio.</p>
  </footer>

  <script type="module">
    import { loadCatalog } from '/js/catalog.js';
    import { getCart, enrichCart, cartTotal, updateQty, removeFromCart, formatPrice } from '/js/cart.js';

    function updateBadge() {
      const el = document.getElementById('cart-count');
      if (el) el.textContent = getCart().reduce((s, i) => s + (i.qty || 0), 0);
    }
    updateBadge();

    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer-overlay');
    const hamburger = document.getElementById('hamburger');
    function openDrawer() { drawer.classList.add('open'); overlay.classList.add('open'); hamburger.setAttribute('aria-expanded', 'true'); document.body.style.overflow = 'hidden'; }
    function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('open'); hamburger.setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }
    hamburger.addEventListener('click', openDrawer);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    let lastY = 0;
    const header = document.getElementById('site-header');
    addEventListener('scroll', () => {
      const y = scrollY;
      const delta = y - lastY;
      if (delta > 6 && y > 70) header.classList.add('nav-hidden');
      else if (delta < -4) header.classList.remove('nav-hidden');
      lastY = y;
    }, { passive: true });

    loadCatalog((data) => {
      if (!data) return;
      renderCart(data);
    });

    function renderCart(catalog) {
      const items = enrichCart(getCart(), catalog);
      const container = document.getElementById('cart-items');
      const subtotalEl = document.getElementById('cart-subtotal');
      const checkoutLink = document.getElementById('checkout-link');
      container.innerHTML = '';

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'cart-empty';
        empty.style.textAlign = 'center';
        empty.style.padding = '3rem 0';
        const msg = document.createElement('p');
        msg.textContent = 'Your cart is currently empty.';
        msg.style.marginBottom = '1.5rem';
        empty.appendChild(msg);
        const link = document.createElement('a');
        link.href = '/store.html';
        link.className = 'btn-checkout';
        link.style.display = 'inline-block';
        link.style.width = 'auto';
        link.style.padding = '0.75rem 2rem';
        link.textContent = 'Explore Collections';
        empty.appendChild(link);
        container.appendChild(empty);
        if (subtotalEl) subtotalEl.textContent = formatPrice(0);
        if (checkoutLink) {
          checkoutLink.style.pointerEvents = 'none';
          checkoutLink.style.opacity = '0.5';
        }
        updateBadge();
        return;
      }

      if (checkoutLink) {
        checkoutLink.style.pointerEvents = 'auto';
        checkoutLink.style.opacity = '1';
      }

      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.dataset.id = item.product_id;

        const img = document.createElement('img');
        img.src = item.product.images?.[0]?.thumb || item.product.images?.[0]?.url || '/img/placeholder.svg';
        img.alt = item.product.name;
        img.width = 80;
        img.height = 107;
        img.className = 'cart-item-img';
        row.appendChild(img);

        const details = document.createElement('div');
        details.className = 'cart-item-details';

        const name = document.createElement('a');
        name.href = `/product.html?slug=${encodeURIComponent(item.product.slug)}`;
        name.className = 'cart-item-name';
        name.textContent = item.product.name;
        details.appendChild(name);
        const sizeEl = document.createElement('p');
        sizeEl.textContent = `Size: ${item.size}`;
        details.appendChild(sizeEl);

        const priceEl = document.createElement('p');
        priceEl.className = 'cart-item-price';
        priceEl.textContent = formatPrice(item.product.price);
        details.appendChild(priceEl);

        const qtyRow = document.createElement('div');
        qtyRow.className = 'qty-row';

        const minus = document.createElement('button');
        minus.type = 'button';
        minus.className = 'qty-btn';
        minus.textContent = '−';
        minus.setAttribute('aria-label', 'Decrease quantity');
        minus.addEventListener('click', () => { updateQty(item.product_id, item.qty - 1, item.size); renderCart(catalog); });
        qtyRow.appendChild(minus);

        const qtyDisplay = document.createElement('span');
        qtyDisplay.className = 'qty-display';
        qtyDisplay.textContent = item.qty;
        qtyRow.appendChild(qtyDisplay);

        const plus = document.createElement('button');
        plus.type = 'button';
        plus.className = 'qty-btn';
        plus.textContent = '+';
        plus.setAttribute('aria-label', 'Increase quantity');
        plus.addEventListener('click', () => { updateQty(item.product_id, item.qty + 1, item.size); renderCart(catalog); });
        qtyRow.appendChild(plus);

        details.appendChild(qtyRow);

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.textContent = 'Remove';
        removeBtn.addEventListener('click', () => { removeFromCart(item.product_id, item.size); renderCart(catalog); });
        details.appendChild(removeBtn);

        row.appendChild(details);

        const lineTotal = document.createElement('div');
        lineTotal.className = 'cart-item-total';
        lineTotal.style.fontWeight = '500';
        lineTotal.textContent = formatPrice(Number(item.product.price) * item.qty);
        row.appendChild(lineTotal);

        container.appendChild(row);
      }

      if (subtotalEl) subtotalEl.textContent = formatPrice(cartTotal(items));
      updateBadge();
    }
  </script>
</body>
</html>
